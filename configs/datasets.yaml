# Dataset registry. Images are read IN PLACE from data_root; nothing is copied.
# data_root resolution order: --data-root CLI flag > $LOOPMAXVIT_DATA_ROOT > the value below.
data_root: "D:/D/my docs/my docs/ideas/attention based works/Datasets"

# Protocol: one labelled pool split stratified by class with a fixed seed (42):
#   split: train-val-test (default) -> 80 / 10 / 10   (val picks best.pt + early stopping, test reported once)
#   split: train-val                -> 80 / 20         (no test set; val numbers are optimistic)
# Fractions: val_frac / test_frac in configs/default.yaml. mean/std come from each folder's DATASET_INFO.md.
datasets:
  paddy:
    path: "paddy-disease-classification/train_images"   # 10 classes, 10,407 images (test_images has no labels)
    format: folder
    mean: [0.494, 0.588, 0.226]
    std: [0.231, 0.232, 0.208]

  rice-leaf-bd:
    path: "RiceLeafDiseaseBD/RiceLeafDiseaseBD/Original images"   # 6 classes, 9,769 images, 1024x1024
    format: folder
    mean: [0.452, 0.486, 0.287]
    std: [0.206, 0.205, 0.180]

  plantvillage:
    path: "plantvillage/color"                           # 38 classes, ~54k lab images
    format: folder
    mean: [0.485, 0.456, 0.406]                          # ImageNet stats (no measured stats in the folder)
    std: [0.229, 0.224, 0.225]

  plantwild:
    path: "PlantWild"                                    # in-the-wild, 89 classes (v1 only)
    format: fiftyone                                     # labels live in samples.json
    filter: {dataset_version: v1}
    label_field: ground_truth
    split_field: split
    official:                                            # used with --official-split (v1: 13,045 / 1,820 / 3,677)
      train: [train]                                     # train-val-test: official train / val / test
      val: [val]                                         # train-val: official train+val / test
      test: [test]
    mean: [0.493, 0.552, 0.382]
    std: [0.272, 0.257, 0.295]

# Not registered: plant-pathology-2020/2021 and cassava exist only as .zip archives.
# Extract one next to the others and add an entry (format: folder, or write a csv reader) to use it.
